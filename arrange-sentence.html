<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arrange the Sentence | Ash's Classroom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      color: #222;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.3rem;
    }

    header p {
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .top-bar {
      max-width: 1000px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .home-button {
      display: inline-block;
      text-decoration: none;
      background: white;
      color: #4f46e5;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .game-container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 20px;
    }

    .game-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .question-number {
      text-align: center;
      color: #666;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .instruction {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
    }

    .word-bank {
      position: relative;
      height: 220px;
      border: 3px dashed #c4b5fd;
      border-radius: 16px;
      background: #f5f3ff;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .answer-area {
      min-height: 120px;
      border: 3px dashed #c4b5fd;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }

    .answer-label {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .word {
      background: #4f46e5;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s;
      white-space: nowrap;
    }

    .word.moving {
      position: absolute;
    }

    .word:hover {
      transform: scale(1.05);
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .check-btn {
      background: #22c55e;
      color: white;
    }

    .reset-btn {
      background: #f59e0b;
      color: white;
    }

    .next-btn {
      background: #4f46e5;
      color: white;
    }

    .feedback {
      text-align: center;
      margin-top: 20px;
      min-height: 35px;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .score {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      color: #555;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }

      .game-card {
        padding: 20px;
      }

      .word-bank {
        height: 250px;
      }

      .word {
        font-size: 1rem;
        padding: 11px 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🧩 Arrange the Sentence</h1>
    <p>Catch the moving words and put them in the correct order.</p>
  </header>

  <div class="top-bar">
    <a href="index.html" class="home-button">
      ← Back to Home
    </a>
  </div>

  <main class="game-container">

    <div class="game-card">

      <div
        class="question-number"
        id="questionNumber">
      </div>

      <div class="instruction">
        Put the words in the correct order.
      </div>

      <div
        class="word-bank"
        id="wordBank">
      </div>

      <div class="answer-label">
        Your sentence:
      </div>

      <div
        class="answer-area"
        id="answerArea">
      </div>

      <div class="buttons">

        <button
          class="check-btn"
          onclick="checkAnswer()">
          Check
        </button>

        <button
          class="reset-btn"
          onclick="resetQuestion()">
          Reset
        </button>

        <button
          class="next-btn"
          onclick="nextQuestion()">
          Next
        </button>

      </div>

      <div
        class="feedback"
        id="feedback">
      </div>

      <div
        class="score"
        id="score">
      </div>

    </div>

  </main>

  <script>

    const questions = [
      ["I", "like", "playing", "football", "after", "school."],
      ["She", "usually", "reads", "books", "at", "night."],
      ["We", "are", "learning", "English", "today."],
      ["My", "brother", "doesn't", "like", "cooking."],
      ["They", "went", "to", "the", "park", "yesterday."],
      ["I", "want", "to", "learn", "how", "to", "swim."],
      ["He", "plays", "badminton", "with", "his", "friends."],
      ["My", "favorite", "subject", "is", "English."],
      ["We", "should", "exercise", "every", "day."],
      ["She", "is", "going", "to", "visit", "her", "grandmother."]
    ];

    let currentQuestion = 0;
    let score = 0;
    let answeredCorrectly = false;

    let movingWords = [];
    let animationId = null;

    const wordBank =
      document.getElementById("wordBank");

    const answerArea =
      document.getElementById("answerArea");

    const feedback =
      document.getElementById("feedback");

    const scoreDisplay =
      document.getElementById("score");

    const questionNumber =
      document.getElementById("questionNumber");


    function shuffle(array) {
      const newArray = [...array];

      for (let i = newArray.length - 1; i > 0; i--) {
        const j =
          Math.floor(Math.random() * (i + 1));

        [
          newArray[i],
          newArray[j]
        ] = [
          newArray[j],
          newArray[i]
        ];
      }

      return newArray;
    }


    function randomSpeed() {
      let speed = 0;

      while (
        speed > -0.6 &&
        speed < 0.6
      ) {
        speed =
          (Math.random() * 2.4) - 1.2;
      }

      return speed;
    }


    function createMovingWord(word) {

      const element =
        document.createElement("div");

      element.className =
        "word moving";

      element.textContent = word;

      wordBank.appendChild(element);

      const bankWidth =
        wordBank.clientWidth;

      const bankHeight =
        wordBank.clientHeight;

      const maxX =
        Math.max(
          0,
          bankWidth - element.offsetWidth
        );

      const maxY =
        Math.max(
          0,
          bankHeight - element.offsetHeight
        );

      const item = {
        element: element,
        x: Math.random() * maxX,
        y: Math.random() * maxY,
        dx: randomSpeed(),
        dy: randomSpeed(),
        active: true
      };

      element.style.left =
        item.x + "px";

      element.style.top =
        item.y + "px";


      element.addEventListener(
        "click",
        function () {

          if (
            element.parentElement === wordBank
          ) {

            item.active = false;

            element.classList.remove("moving");

            element.style.left = "";
            element.style.top = "";

            answerArea.appendChild(element);

          } else {

            answerArea.removeChild(element);

            wordBank.appendChild(element);

            element.classList.add("moving");

            item.active = true;

            const newMaxX =
              wordBank.clientWidth -
              element.offsetWidth;

            const newMaxY =
              wordBank.clientHeight -
              element.offsetHeight;

            item.x =
              Math.random() *
              Math.max(0, newMaxX);

            item.y =
              Math.random() *
              Math.max(0, newMaxY);

            item.dx =
              randomSpeed();

            item.dy =
              randomSpeed();

            element.style.left =
              item.x + "px";

            element.style.top =
              item.y + "px";
          }

        }
      );

      movingWords.push(item);
    }


    function animateWords() {

      movingWords.forEach(
        function (item) {

          if (!item.active) {
            return;
          }

          const element =
            item.element;

          if (
            element.parentElement !== wordBank
          ) {
            return;
          }

          const bankWidth =
            wordBank.clientWidth;

          const bankHeight =
            wordBank.clientHeight;

          const wordWidth =
            element.offsetWidth;

          const wordHeight =
            element.offsetHeight;

          item.x += item.dx;
          item.y += item.dy;

          if (item.x <= 0) {
            item.x = 0;
            item.dx *= -1;
          }

          if (
            item.x + wordWidth >=
            bankWidth
          ) {
            item.x =
              bankWidth - wordWidth;

            item.dx *= -1;
          }

          if (item.y <= 0) {
            item.y = 0;
            item.dy *= -1;
          }

          if (
            item.y + wordHeight >=
            bankHeight
          ) {
            item.y =
              bankHeight - wordHeight;

            item.dy *= -1;
          }

          element.style.left =
            item.x + "px";

          element.style.top =
            item.y + "px";
        }
      );

      animationId =
        requestAnimationFrame(
          animateWords
        );
    }


    function loadQuestion() {

      if (animationId) {
        cancelAnimationFrame(
          animationId
        );
      }

      movingWords = [];

      wordBank.innerHTML = "";
      answerArea.innerHTML = "";

      feedback.textContent = "";
      answeredCorrectly = false;

      questionNumber.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

      const shuffledWords =
        shuffle(
          questions[currentQuestion]
        );

      shuffledWords.forEach(
        function (word) {
          createMovingWord(word);
        }
      );

      updateScore();

      animateWords();
    }


    function checkAnswer() {

      const selectedWords =
        Array.from(
          answerArea.children
        ).map(
          function (element) {
            return element.textContent;
          }
        );

      if (
        selectedWords.length !==
        questions[currentQuestion].length
      ) {

        feedback.textContent =
          "⚠️ Use all the words first.";

        feedback.style.color =
          "#f59e0b";

        return;
      }

      const studentSentence =
        selectedWords.join(" ");

      const correctSentence =
        questions[currentQuestion].join(" ");

      if (
        studentSentence === correctSentence
      ) {

        feedback.textContent =
          "✅ Correct! Great job!";

        feedback.style.color =
          "#16a34a";

        if (!answeredCorrectly) {
          score++;
          answeredCorrectly = true;
          updateScore();
        }

      } else {

        feedback.textContent =
          "❌ Not quite. Try again!";

        feedback.style.color =
          "#dc2626";

      }
    }


    function resetQuestion() {
      loadQuestion();
    }


    function nextQuestion() {

      currentQuestion++;

      if (
        currentQuestion >= questions.length
      ) {
        currentQuestion = 0;
      }

      loadQuestion();
    }


    function updateScore() {

      scoreDisplay.textContent =
        "Score: " + score;

    }


    loadQuestion();

  </script>

</body>

</html>
