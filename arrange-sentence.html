<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrange the Sentence | Ash's Classroom">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      color: #222;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    header p {
      margin-top: 8px;
    }

    .top-bar {
      max-width: 1000px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .home-button {
      display: inline-block;
      text-decoration: none;
      background: white;
      color: #4f46e5;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .game-container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 20px;
    }

    .game-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .question-number {
      font-size: 1rem;
      color: #666;
      margin-bottom: 10px;
    }

    .instruction {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 25px;
      text-align: center;
    }

    .word-bank,
    .answer-area {
      min-height: 110px;
      border: 3px dashed #c4b5fd;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .word-bank {
      background: #f5f3ff;
      margin-bottom: 25px;
    }

    .answer-area {
      background: #fafafa;
    }

    .word {
      background: #4f46e5;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s;
    }

    .word:hover {
      transform: scale(1.05);
    }

    .answer-label {
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .check-btn {
      background: #22c55e;
      color: white;
    }

    .reset-btn {
      background: #f59e0b;
      color: white;
    }

    .next-btn {
      background: #4f46e5;
      color: white;
    }

    .feedback {
      margin-top: 20px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      min-height: 32px;
    }

    .score {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      color: #555;
    }

    @media (max-width: 600px) {
      .game-card {
        padding: 20px;
      }

      .word {
        font-size: 1rem;
        padding: 12px 15px;
      }

      header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🧩 Arrange the Sentence</h1>
    <p>Click the words in the correct order.</p>
  </header>

  <div class="top-bar">
    <a class="home-button" href="index.html">← Back to Home</a>
  </div>

  <div class="game-container">
    <div class="game-card">

      <div class="question-number" id="questionNumber"></div>

      <div class="instruction">
        Put the words in the correct order.
      </div>

      <div class="word-bank" id="wordBank"></div>

      <div class="answer-label">Your sentence:</div>

      <div class="answer-area" id="answerArea"></div>

      <div class="buttons">
        <button class="check-btn" onclick="checkAnswer()">Check</button>
        <button class="reset-btn" onclick="resetQuestion()">Reset</button>
        <button class="next-btn" onclick="nextQuestion()">Next</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="score" id="score"></div>

    </div>
  </div>

  <script>
    const questions = [
      ["I", "like", "playing", "football", "after", "school."],
      ["She", "usually", "reads", "books", "at", "night."],
      ["We", "are", "learning", "English", "today."],
      ["My", "brother", "doesn't", "like", "cooking."],
      ["They", "went", "to", "the", "park", "yesterday."],
      ["I", "want", "to", "learn", "how", "to", "swim."],
      ["He", "plays", "badminton", "with", "his", "friends."],
      ["My", "favorite", "subject", "is", "English."],
      ["We", "should", "exercise", "every", "day."],
      ["She", "is", "going", "to", "visit", "her", "grandmother."]
    ];

    let currentQuestion = 0;
    let score = 0;
    let currentWords = [];

    const wordBank = document.getElementById("wordBank");
    const answerArea = document.getElementById("answerArea");
    const feedback = document.getElementById("feedback");
    const scoreDisplay = document.getElementById("score");
    const questionNumber = document.getElementById("questionNumber");

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function loadQuestion() {
      feedback.textContent = "";
      answerArea.innerHTML = "";
      wordBank.innerHTML = "";

      currentWords = shuffle(questions[currentQuestion]);

      questionNumber.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      currentWords.forEach(word => {
        const wordElement = createWordElement(word);
        wordBank.appendChild(wordElement);
      });

      updateScore();
    }

    function createWordElement(word) {
      const div = document.createElement("div");
      div.className = "word";
      div.textContent = word;

      div.addEventListener("click", function () {
        if (div.parentElement === wordBank) {
          answerArea.appendChild(div);
        } else {
          wordBank.appendChild(div);
        }
      });

      return div;
    }

    function checkAnswer() {
      const answerWords = [...answerArea.children]
        .map(el => el.textContent);

      const correctWords = questions[currentQuestion];

      if (answerWords.length !== correctWords.length) {
        feedback.textContent = "⚠️ Use all the words first.";
        feedback.style.color = "#f59e0b";
        return;
      }

      const userAnswer = answerWords.join(" ");
      const correctAnswer = correctWords.join(" ");

      if (userAnswer === correctAnswer) {
        feedback.textContent = "✅ Correct! Great job!";
        feedback.style.color = "#16a34a";

        if (!answerArea.dataset.correct) {
          score++;
          answerArea.dataset.correct = "true";
        }

        updateScore();
      } else {
        feedback.textContent = "❌ Not quite. Try again!";
        feedback.style.color = "#dc2626";
      }
    }

    function resetQuestion() {
      answerArea.dataset.correct = "";
      loadQuestion();
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion >= questions.length) {
        currentQuestion = 0;
      }

      answerArea.dataset.correct = "";
      loadQuestion();
    }

    function updateScore() {
      scoreDisplay.textContent = `Score: ${score}`;
    }

    loadQuestion();
  </script>

</body>
</html>
