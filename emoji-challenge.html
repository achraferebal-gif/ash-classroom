<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emoji Challenge | Ash's Classroom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      color: #222;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #f97316, #f59e0b);
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2.4rem;
    }

    header p {
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .top-bar {
      max-width: 950px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .home-button {
      display: inline-block;
      text-decoration: none;
      background: white;
      color: #ea580c;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .game-container {
      max-width: 950px;
      margin: 25px auto;
      padding: 20px;
    }

    .game-card {
      background: white;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    .question-number {
      color: #666;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .emoji-box {
      background: #fff7ed;
      border: 3px dashed #fdba74;
      border-radius: 20px;
      padding: 35px 20px;
      font-size: 5rem;
      margin-bottom: 25px;
      min-height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .instruction {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .hint-box {
      background: #fef3c7;
      border-radius: 12px;
      padding: 15px;
      margin: 0 auto 20px;
      max-width: 650px;
      min-height: 55px;
      font-size: 1.05rem;
      color: #92400e;
      display: none;
    }

    input {
      width: 100%;
      max-width: 500px;
      padding: 15px 18px;
      border-radius: 12px;
      border: 2px solid #fdba74;
      font-size: 1.1rem;
      outline: none;
      text-align: center;
    }

    input:focus {
      border-color: #f97316;
    }

    .buttons {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .check-btn {
      background: #22c55e;
      color: white;
    }

    .hint-btn {
      background: #f59e0b;
      color: white;
    }

    .reveal-btn {
      background: #ef4444;
      color: white;
    }

    .next-btn {
      background: #4f46e5;
      color: white;
    }

    .feedback {
      margin-top: 20px;
      min-height: 35px;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .answer-display {
      margin-top: 10px;
      font-size: 1.15rem;
      font-weight: bold;
      min-height: 30px;
    }

    .score {
      margin-top: 18px;
      color: #555;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.9rem;
      }

      .emoji-box {
        font-size: 3.5rem;
      }

      .game-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>😀 Emoji Challenge</h1>
    <p>Look at the emojis and guess the English word or phrase.</p>
  </header>

  <div class="top-bar">
    <a href="index.html" class="home-button">
      ← Back to Home
    </a>
  </div>

  <main class="game-container">

    <div class="game-card">

      <div class="question-number" id="questionNumber"></div>

      <div class="emoji-box" id="emojiBox"></div>

      <div class="instruction">
        What word or phrase do the emojis represent?
      </div>

      <div class="hint-box" id="hintBox"></div>

      <input
        type="text"
        id="answerInput"
        placeholder="Type your answer here..."
        autocomplete="off"
      >

      <div class="buttons">

        <button class="check-btn" onclick="checkAnswer()">
          Check
        </button>

        <button class="hint-btn" onclick="showHint()">
          Hint
        </button>

        <button class="reveal-btn" onclick="revealAnswer()">
          Reveal Answer
        </button>

        <button class="next-btn" onclick="nextQuestion()">
          Next
        </button>

      </div>

      <div class="feedback" id="feedback"></div>

      <div class="answer-display" id="answerDisplay"></div>

      <div class="score" id="score"></div>

    </div>

  </main>


  <script>

    const questions = [

      {
        emoji: "🌧️ ☂️",
        answer: "rainy day",
        accepted: ["rainy day", "rain"],
        hint: "You usually need an umbrella."
      },

      {
        emoji: "📚 🏫",
        answer: "school",
        accepted: ["school"],
        hint: "Students go here to learn."
      },

      {
        emoji: "⚽ 👟",
        answer: "play football",
        accepted: ["play football", "playing football", "football"],
        hint: "It is a popular sport."
      },

      {
        emoji: "🍎 🥤",
        answer: "snack",
        accepted: ["snack", "have a snack"],
        hint: "A small amount of food between meals."
      },

      {
        emoji: "😴 🛏️",
        answer: "go to sleep",
        accepted: ["go to sleep", "sleep", "go to bed"],
        hint: "You usually do this at night."
      },

      {
        emoji: "📱 💬",
        answer: "text a friend",
        accepted: [
          "text a friend",
          "message a friend",
          "send a message"
        ],
        hint: "You communicate using your phone."
      },

      {
        emoji: "🎧 🎵",
        answer: "listen to music",
        accepted: [
          "listen to music",
          "listening to music"
        ],
        hint: "You might use headphones for this."
      },

      {
        emoji: "🍳 👨‍🍳",
        answer: "cooking",
        accepted: [
          "cooking",
          "cook",
          "make food"
        ],
        hint: "You prepare food."
      },

      {
        emoji: "✈️ 🧳",
        answer: "travel",
        accepted: [
          "travel",
          "travelling",
          "traveling",
          "go on a trip"
        ],
        hint: "You visit another place."
      },

      {
        emoji: "🏃 ❤️",
        answer: "exercise",
        accepted: [
          "exercise",
          "running",
          "work out",
          "working out"
        ],
        hint: "It helps keep your body healthy."
      },

      {
        emoji: "🎬 🍿",
        answer: "watch a movie",
        accepted: [
          "watch a movie",
          "watching a movie",
          "movie",
          "cinema"
        ],
        hint: "People often eat popcorn while doing this."
      },

      {
        emoji: "📖 ☕",
        answer: "read a book",
        accepted: [
          "read a book",
          "reading",
          "reading a book"
        ],
        hint: "A relaxing activity with pages and words."
      },

      {
        emoji: "🚌 🏫",
        answer: "go to school",
        accepted: [
          "go to school",
          "school bus",
          "take the bus to school"
        ],
        hint: "A common morning journey for students."
      },

      {
        emoji: "🎂 🎉",
        answer: "birthday party",
        accepted: [
          "birthday party",
          "birthday"
        ],
        hint: "There is usually cake."
      },

      {
        emoji: "🛒 🛍️",
        answer: "go shopping",
        accepted: [
          "go shopping",
          "shopping"
        ],
        hint: "You buy things."
      }

    ];


    let currentQuestion = 0;
    let score = 0;
    let answeredCorrectly = false;


    const emojiBox =
      document.getElementById("emojiBox");

    const answerInput =
      document.getElementById("answerInput");

    const feedback =
      document.getElementById("feedback");

    const hintBox =
      document.getElementById("hintBox");

    const answerDisplay =
      document.getElementById("answerDisplay");

    const scoreDisplay =
      document.getElementById("score");

    const questionNumber =
      document.getElementById("questionNumber");


    function normalize(text) {

      return text
        .trim()
        .toLowerCase()
        .replace(/[.!?]/g, "");

    }


    function loadQuestion() {

      const question =
        questions[currentQuestion];

      emojiBox.textContent =
        question.emoji;

      questionNumber.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

      answerInput.value = "";

      feedback.textContent = "";

      answerDisplay.textContent = "";

      hintBox.textContent = "";

      hintBox.style.display = "none";

      answeredCorrectly = false;

      updateScore();

      answerInput.focus();
    }


    function checkAnswer() {

      const userAnswer =
        normalize(answerInput.value);

      if (userAnswer === "") {

        feedback.textContent =
          "⚠️ Type an answer first.";

        feedback.style.color =
          "#f59e0b";

        return;
      }


      const acceptedAnswers =
        questions[currentQuestion]
          .accepted
          .map(normalize);


      if (
        acceptedAnswers.includes(userAnswer)
      ) {

        feedback.textContent =
          "✅ Correct! Great job!";

        feedback.style.color =
          "#16a34a";

        answerDisplay.textContent = "";

        if (!answeredCorrectly) {

          score++;

          answeredCorrectly = true;

          updateScore();

        }

      } else {

        feedback.textContent =
          "❌ Not quite. Try again!";

        feedback.style.color =
          "#dc2626";

      }

    }


    function showHint() {

      hintBox.textContent =
        "💡 " +
        questions[currentQuestion].hint;

      hintBox.style.display = "block";

    }


    function revealAnswer() {

      answerDisplay.textContent =
        "Answer: " +
        questions[currentQuestion].answer;

      feedback.textContent = "";

    }


    function nextQuestion() {

      currentQuestion++;

      if (
        currentQuestion >=
        questions.length
      ) {

        currentQuestion = 0;

      }

      loadQuestion();

    }


    function updateScore() {

      scoreDisplay.textContent =
        "Score: " + score;

    }


    answerInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          checkAnswer();
        }

      }
    );


    loadQuestion();

  </script>

</body>

</html>
